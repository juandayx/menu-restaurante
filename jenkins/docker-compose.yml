# Servidor Jenkins (gestor de operaciones de integración continua)
# Levantar con:  cd jenkins && docker compose up -d --build

name: jenkins-ci

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root                          # necesario para usar el socket de Docker en el laboratorio
    ports:
      - "8080:8080"                     # interfaz web de Jenkins
      - "50000:50000"                   # conexión de agentes
    volumes:
      - jenkins_home:/var/jenkins_home              # configuración, jobs e historial persisten
      - /var/run/docker.sock:/var/run/docker.sock   # Jenkins usa el Docker del equipo
    restart: unless-stopped

volumes:
  jenkins_home:
