<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú del Restaurante</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #faf7f2; color: #2b2118; }
    header { background: #7a2e1d; color: #fff; padding: 24px; text-align: center; }
    header h1 { margin: 0 0 6px; font-size: 28px; }
    #estado { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 18px; }
    form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    form input, form textarea { padding: 10px; border: 1px solid #d8cfc4; border-radius: 8px; font: inherit; }
    form textarea { grid-column: 1 / -1; resize: vertical; }
    button { background: #7a2e1d; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer; }
    button:hover { background: #5e2215; }
    form button { grid-column: 1 / -1; }
    .plato { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee5da; }
    .plato:last-child { border-bottom: 0; }
    .plato small { color: #7b6d5f; }
    .precio { font-weight: 700; white-space: nowrap; }
    .borrar { background: transparent; color: #a33; padding: 4px 8px; }
    #msg { min-height: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Menú del Restaurante</h1>
    <span id="estado">Comprobando conexión...</span>
  </header>
  <main>
    <section class="card">
      <h2>Agregar plato</h2>
      <form id="form">
        <input name="nombre" placeholder="Nombre del plato" required />
        <input name="precio" type="number" min="0" step="100" placeholder="Precio (COP)" required />
        <textarea name="descripcion" rows="2" placeholder="Descripción"></textarea>
        <button type="submit">Guardar en la base de datos</button>
      </form>
      <div id="msg"></div>
    </section>
    <section class="card">
      <h2>Platos guardados</h2>
      <div id="lista">Cargando...</div>
    </section>
  </main>
  <script>
    const pesos = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });

    async function estado() {
      const el = document.getElementById("estado");
      try {
        const r = await fetch("/health");
        const d = await r.json();
        el.textContent = d.estado === "ok"
          ? `Conectado al contenedor "${d.conectado_a}" · ${d.base_de_datos}`
          : "Sin conexión con la base de datos";
      } catch { el.textContent = "Sin conexión con la base de datos"; }
    }

    async function cargar() {
      const lista = document.getElementById("lista");
      const r = await fetch("/api/platos");
      const platos = await r.json();
      if (!Array.isArray(platos) || platos.length === 0) { lista.textContent = "No hay platos todavía."; return; }
      lista.innerHTML = "";
      platos.forEach(p => {
        const div = document.createElement("div");
        div.className = "plato";
        const info = document.createElement("div");
        const nombre = document.createElement("strong");
        nombre.textContent = p.nombre;
        const desc = document.createElement("small");
        desc.textContent = p.descripcion;
        info.append(nombre, document.createElement("br"), desc);
        const precio = document.createElement("span");
        precio.className = "precio";
        precio.textContent = pesos.format(p.precio);
        const borrar = document.createElement("button");
        borrar.className = "borrar";
        borrar.textContent = "✕";
        borrar.title = "Eliminar";
        borrar.onclick = async () => { await fetch(`/api/platos/${p.id}`, { method: "DELETE" }); cargar(); };
        div.append(info, precio, borrar);
        lista.appendChild(div);
      });
    }

    document.getElementById("form").addEventListener("submit", async e => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      const r = await fetch("/api/platos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
      const msg = document.getElementById("msg");
      if (r.ok) { msg.textContent = "✔ Plato guardado en PostgreSQL"; e.target.reset(); cargar(); }
      else { const d = await r.json(); msg.textContent = "Error: " + d.error; }
    });

    estado();
    cargar();
  </script>
</body>
</html>
