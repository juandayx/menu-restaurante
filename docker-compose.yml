# Orquestación de los dos contenedores del proyecto
# Levantar todo con:  docker compose up --build

services:
  # Contenedor 1: aplicación web (Node.js)
  app:
    build: ./app
    ports:
      - "${APP_PORT}:3000"
    environment:
      APP_PORT: 3000
      DB_HOST: localhost                       # nombre del servicio, NO localhost ni IP
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy      # espera a que la base de datos esté lista
    networks:
      - red-menu
    restart: unless-stopped

  # Contenedor 2: base de datos (PostgreSQL con Dockerfile propio)
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos-menu:/var/lib/postgresql/data            # los datos persisten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-menu
    restart: unless-stopped

# Red propia para que los contenedores se vean por nombre
networks:
  red-menu:
    driver: bridge

# Volumen para guardar los datos de PostgreSQL
volumes:
  datos-menu:
